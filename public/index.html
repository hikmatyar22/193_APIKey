<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Madrid API Key</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #001a4d 0%, #000814 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(0, 51, 153, 0.3);
      padding: 40px;
      width: 400px;
      max-width: 90%;
      text-align: center;
      animation: fadeIn 1.2s ease-in-out;
      position: relative;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 15px #ffd700, 0 0 30px rgba(255, 255, 255, 0.3);
      margin: 15px 0 25px;
      letter-spacing: 1.5px;
      font-size: 1.5rem;
    }

    .logo {
      width: 80px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
      animation: float 3s ease-in-out infinite;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid rgba(255, 215, 0, 0.4);
      background: rgba(255, 255, 255, 0.05);
      color: #ffd700;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 15px;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      background: linear-gradient(90deg, #003399, #ffd700);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      margin-bottom: 20px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), 0 0 35px rgba(0, 51, 153, 0.6);
    }

    .textarea-wrapper {
      position: relative;
      width: 100%;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      resize: none;
      background: rgba(255, 255, 255, 0.05);
      color: #ffd700;
      font-family: 'Courier New', monospace;
      text-align: center;
      box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.3);
    }

    textarea::placeholder {
      color: #999;
    }

    .copy-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: #ffd700;
      color: #000814;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      opacity: 0.9;
    }

    .copy-btn:hover {
      background: #fff;
      color: #003399;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
      transform: scale(1.05);
    }

    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #ccc;
      letter-spacing: 0.5px;
    }

    footer span {
      color: #ffd700;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(180px);
      z-index: -1;
      opacity: 0.6;
      animation: moveGlow 7s infinite alternate ease-in-out;
    }

    .glow1 { background: #003399; top: 15%; left: 20%; }
    .glow2 { background: #ffd700; bottom: 15%; right: 20%; }

    @keyframes moveGlow {
      from { transform: scale(1); opacity: 0.6; }
      to { transform: scale(1.2); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" alt="Real Madrid Logo" class="logo">
    <h1>REAL MADRID API KEY</h1>

    <input id="service_name" type="text" placeholder="Masukkan nama service...">
    <button onclick="buatApiKey()">Buat Sekarang</button>

    <div class="textarea-wrapper">
      <textarea id="apikey" readonly placeholder="API Key akan muncul di sini..."></textarea>
      <button class="copy-btn" onclick="copyApiKey()">Copy</button>
    </div>

    <footer>Powered by <span>Los Blancos Tech</span></footer>
  </div>

  <script>
    async function buatApiKey() {
      const textarea = document.getElementById('apikey');
      const serviceName = document.getElementById('service_name').value.trim();

      if (!serviceName) {
        alert("Masukkan nama service terlebih dahulu!");
        return;
      }

      textarea.value = "🔄 Membuat API Key...";
      textarea.style.opacity = 0.5;

      try {
        const response = await fetch('/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ service_name: serviceName })
        });

        if (!response.ok) throw new Error("Gagal menghubungi server!");

        const data = await response.json();
        textarea.value = data.apiKey + "\n✅ Berhasil disimpan untuk service: " + serviceName;
      } catch (err) {
        textarea.value = "❌ Terjadi kesalahan: " + err.message;
      } finally {
        textarea.style.opacity = 1;
      }
    }

    function copyApiKey() {
      const textarea = document.getElementById('apikey');
      const apiKey = textarea.value.split("\n")[0];

      if (!apiKey || apiKey.startsWith("🔄") || apiKey.startsWith("❌")) {
        alert("Belum ada API Key untuk disalin!");
        return;
      }

      navigator.clipboard.writeText(apiKey)
        .then(() => {
          const copyBtn = document.querySelector('.copy-btn');
          copyBtn.textContent = "Copied!";
          copyBtn.style.background = "#00c853";
          copyBtn.style.color = "#fff";

          setTimeout(() => {
            copyBtn.textContent = "Copy";
            copyBtn.style.background = "#ffd700";
            copyBtn.style.color = "#000814";
          }, 1500);
        })
        .catch(() => alert("Gagal menyalin API Key!"));
    }
  </script>
</body>
</html>
